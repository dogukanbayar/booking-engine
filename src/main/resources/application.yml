server:
  port: 8080

spring:
  application:
    name: booking-engine-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/booking_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: Europe/Istanbul
